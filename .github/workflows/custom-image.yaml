name: Custom Jellyfin image

on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: Server commit or ref (uwuevelyn/jellyfin)
        required: true
        default: feature/s3-object-storage
      web_ref:
        description: Web commit or ref (jellyfin/jellyfin-web)
        required: true
        default: master
      image_tag:
        description: Mutable image tag
        required: true
        default: s3-edge

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-jellyfin-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/uwuevelyn/jellyfin

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            package_arch: amd64
            dotnet_arch: x64
            image_arch: amd64
            target_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            package_arch: arm64
            dotnet_arch: arm64
            image_arch: arm64v8
            target_arch: arm64/v8
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: uwuevelyn/jellyfin
          ref: ${{ inputs.server_ref }}
          path: jellyfin-server

      - name: Check out web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellyfin/jellyfin-web
          ref: ${{ inputs.web_ref }}
          path: jellyfin-web

      - name: Resolve revisions
        id: rev
        run: |
          echo "server=$(git -C jellyfin-server rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "web=$(git -C jellyfin-web rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            DOTNET_VERSION=10.0
            NODEJS_VERSION=24
            PACKAGE_ARCH=${{ matrix.package_arch }}
            DOTNET_ARCH=${{ matrix.dotnet_arch }}
            IMAGE_ARCH=${{ matrix.image_arch }}
            TARGET_ARCH=${{ matrix.target_arch }}
            JELLYFIN_VERSION=13.0.0-s3.${{ github.run_number }}
          tags: ${{ env.IMAGE }}:s3-${{ github.run_number }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/uwuevelyn/jellyfin-packaging
            org.opencontainers.image.revision=${{ steps.rev.outputs.server }}
            moe.desuwa.jellyfin.web-revision=${{ steps.rev.outputs.web }}

  manifest:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish manifests
        env:
          MUTABLE_TAG: ${{ inputs.image_tag }}
          RUN_TAG: s3-${{ github.run_number }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${MUTABLE_TAG}" \
            --tag "${IMAGE}:${RUN_TAG}" \
            "${IMAGE}:${RUN_TAG}-amd64" \
            "${IMAGE}:${RUN_TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${RUN_TAG}"
